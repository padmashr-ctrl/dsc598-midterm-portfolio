<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Earlier torn heart concept</title>
  <desc id="desc">A crimson paper heart with a wide open tear and only a few loose stitches.</desc>
  <defs>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="4" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="13" stdDeviation="12" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="#eee6d8" filter="url(#paper)"/>
  <g filter="url(#shadow)">
    <path d="M585 694C520 650 393 562 393 447C393 366 454 324 520 324C560 324 591 346 613 380L596 423L616 455L590 496L614 537L587 578L605 619Z" fill="#a6222f"/>
    <path d="M651 694C716 650 843 562 843 447C843 366 782 324 716 324C676 324 645 346 623 380L648 422L629 459L657 495L633 539L661 578L638 621Z" fill="#a6222f"/>
  </g>
  <g stroke="#e7d4ae" stroke-width="7" stroke-linecap="round">
    <path d="M602 455L640 474"/>
    <path d="M600 538L645 552"/>
    <path d="M601 620L645 630"/>
  </g>
</svg>
